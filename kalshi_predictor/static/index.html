<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalshi Predictor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0b0b'/%3E%3Cpath d='M7 21l6-6 4 4 8-9' fill='none' stroke='%233987e5' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
<script>
  // Apply a saved theme before the first paint so the page does not flash.
  try {
    const theme = JSON.parse(localStorage.getItem("theme"));
    if (theme) document.documentElement.dataset.theme = theme;
  } catch (err) {}
</script>
<script type="module" src="/static/js/app.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="8" fill="currentColor"/>
      <path d="M7 21l6-6 4 4 8-9" fill="none" stroke="var(--up)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Kalshi Predictor</span>
  </a>
  <form class="omni" id="omni" role="search" autocomplete="off">
    <svg class="omni-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16zM21 21l-4.35-4.35"/></svg>
    <input id="omni-input" type="search" spellcheck="false" aria-label="Search markets"
           placeholder="Search markets, or paste a Kalshi link or ticker">
    <kbd class="omni-kbd">/</kbd>
  </form>
  <nav class="tabs" aria-label="Sections">
    <a href="#/" data-tab="market">Markets</a>
    <a href="#/signals" data-tab="signals">Signals</a>
    <a href="#/record" data-tab="record">Track record</a>
  </nav>
  <button class="icon-btn" id="theme" type="button" aria-label="Switch between light and dark"></button>
</header>
<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="Live markets"></aside>
  <main id="view"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
